# =====================================================================
# 킹세종 배포: DB + 교정 엔진 + 서버 + HTTPS(Caddy)를 한 대에 띄운다.
#   cd deploy && cp .env.example .env && (값 채우기)
#   docker compose up -d --build
# 밖으로 열리는 건 Caddy(80, 443) 뿐. 엔진·DB는 안쪽 네트워크에서만 보인다.
# 엔진 소스는 서버 레포 옆에 클론해 둔다 (ENGINE_SRC, 기본 ../../Python-correction-engine).
# 자세한 순서는 README.md
# =====================================================================
name: kingsejong

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kingsejong}
      POSTGRES_USER: ${DB_USER:-kingsejong}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣어 주세요}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  engine:
    build:
      context: .
      dockerfile: engine.Dockerfile
      additional_contexts:
        engine: ${ENGINE_SRC:-../../Python-correction-engine}
    image: kingsejong-engine
    restart: unless-stopped
    environment:
      ENGINE_VERSION: ${ENGINE_VERSION:-0.3.0}
      ENGINE_WORKERS: ${ENGINE_WORKERS:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-5000}
    volumes:
      # 정답 획 폰트(fonts/)와 사전(extracted/). scripts/engine-data.sh 로 만든다
      - ./engine-data:/app/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kingsejong-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-kingsejong}
      DB_USER: ${DB_USER:-kingsejong}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 넣어 주세요 (32바이트 이상)}
      ENGINE_BASE_URL: http://engine:8000
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY를 .env에 넣어 주세요 (32자 이상 무작위)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?프론트 주소를 CORS_ALLOWED_ORIGINS에 넣어 주세요}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
    healthcheck:
      # 이미지에 curl이 없어도 되게 bash로 /api/v1/health 를 부른다
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'status' <&3"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN을 .env에 넣어 주세요 (예 152-67-1-2.sslip.io)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
