# =====================================================================
# 공통 설정 (모든 프로필)
# =====================================================================
spring:
  application:
    name: kingsejong-server
  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Flyway 를 쓰지 않으므로 JPA 가 엔티티를 보고 테이블을 만든다 (컬럼 삭제·이름 변경은 반영 안 됨)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc.time_zone: Asia/Seoul

  jackson:
    serialization:
      write-dates-as-timestamps: false   # ISO-8601 문자열
    deserialization:
      fail-on-unknown-properties: true   # 요청 필드 오타("stagee")를 조용히 무시하지 않고 422
    time-zone: Asia/Seoul                # 응답 시간은 +09:00 (API 명세)

server:
  port: 8080
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # 환경 변수 JWT_SECRET 필수 (32바이트 이상). 기본값은 local·test 프로필에만 있다
    secret: ${JWT_SECRET}
    ttl-days: 30
  engine:
    # 환경 변수 ENGINE_BASE_URL 필수. 기본값은 local·test 프로필에만 있다
    base-url: ${ENGINE_BASE_URL}
    connect-timeout: 2s
    read-timeout: 10s
    # 엔진 정답 획 사전을 만든 폰트 (응답의 font). 엔진이 동국체 사전으로 바꾸면 같이 바꾼다
    reference-font: NotoSansKR-Light

# =====================================================================
# local — `docker compose up -d` 로 띄운 postgres 에 붙는다
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: local
    # 레포 루트의 .env 를 앱도 읽는다 (없으면 무시)
    import: optional:file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:kingsejong}
    username: ${DB_USER:kingsejong}
    password: ${DB_PASSWORD:kingsejong1234}

  jpa:
    show-sql: true

logging:
  level:
    com.kingsejong: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:kingsejong-local-dev-secret-key-0123456789}
  engine:
    # 로컬 엔진: 엔진 레포에서 .venv/bin/uvicorn app.main:app --port 8000
    base-url: ${ENGINE_BASE_URL:http://localhost:8000}

# =====================================================================
# test — Testcontainers(@ServiceConnection)가 datasource 를 넣어 주므로 url 을 적지 않는다
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: kingsejong-test-secret-key-0123456789abcdef
  engine:
    # 테스트는 실제 엔진을 부르지 않는다 (닫힌 포트). 판정이 필요한 테스트는 EngineClient를 가짜로 바꾼다
    base-url: http://127.0.0.1:1

# =====================================================================
# prod — 배포 서버. 값은 전부 환경 변수로
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
