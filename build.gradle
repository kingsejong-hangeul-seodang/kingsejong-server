plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kingsejong'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web / Validation
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// DB (JPA + PostgreSQL). 스키마는 JPA가 엔티티를 보고 만든다 (ddl-auto: update, Flyway 안 씀)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	// API 문서 (Swagger UI: /swagger-ui.html)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.1'

	// Actuator (DB 포함 상세 상태: /actuator/health)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Lombok / DevTools
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Test — 실제 PostgreSQL(Testcontainers)로 테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// plain jar 비활성 — build/libs 에 실행 JAR 하나만 남긴다
jar {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()

	// Colima / OrbStack 처럼 /var/run/docker.sock 이 없는 Docker 를 쓰는 경우 자동 감지.
	// DOCKER_HOST 가 이미 있으면 그대로 둔다. (Docker Desktop 은 설정 없이 동작)
	if (!System.getenv('DOCKER_HOST')) {
		def home = System.getProperty('user.home')
		def candidates = [
			"${home}/.colima/default/docker.sock",
			"${home}/.orbstack/run/docker.sock",
			"${home}/.rd/docker.sock",
		]
		def sock = candidates.find { new File(it).exists() }
		if (sock) {
			environment 'DOCKER_HOST', "unix://${sock}"
			environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
		}
	}
}
